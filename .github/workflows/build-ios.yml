name: Build iOS IPA (unsigned)

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  ios:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 26 (Swift 6.2)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.3'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prebuild iOS project
        run: npx expo prebuild --platform ios --no-install

      - name: Install CocoaPods
        working-directory: ios
        run: pod install

      - name: Resolve Xcode workspace and scheme
        id: xcode
        working-directory: ios
        run: |
          WORKSPACE=$(find . -maxdepth 1 -name '*.xcworkspace' | head -n 1)
          SCHEME=$(xcodebuild -list -json -workspace "$WORKSPACE" | node -e "
            const j = JSON.parse(require('fs').readFileSync(0, 'utf8'));
            const schemes = j.workspace.schemes || [];
            const preferred =
              schemes.find((s) => s === 'LocationWrapped') ||
              schemes.find((s) => s === 'Location Wrapped') ||
              schemes.find((s) => !s.startsWith('EX') && !s.includes('Pods') && s !== 'ReactCodegen') ||
              schemes[0];
            if (!preferred) {
              console.error('No Xcode schemes found');
              process.exit(1);
            }
            process.stdout.write(preferred);
          ")
          echo "workspace=$WORKSPACE" >> "$GITHUB_OUTPUT"
          echo "scheme=$SCHEME" >> "$GITHUB_OUTPUT"
          echo "Using workspace=$WORKSPACE scheme=$SCHEME"
          xcodebuild -version

      - name: Build unsigned iOS app
        working-directory: ios
        run: |
          xcodebuild \
            -workspace "${{ steps.xcode.outputs.workspace }}" \
            -scheme "${{ steps.xcode.outputs.scheme }}" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            ONLY_ACTIVE_ARCH=NO \
            build

      - name: Package IPA
        run: |
          APP_PATH=$(find ios/build -name "Location Wrapped.app" | head -n 1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find ios/build -name "LocationWrapped.app" | head -n 1)
          fi
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find ios/build -path "*/Build/Products/Release-iphoneos/*.app" | head -n 1)
          fi
          if [ -z "$APP_PATH" ]; then
            echo "Could not find built .app"
            find ios/build -name "*.app" | head -n 50
            exit 1
          fi
          echo "Packaging $APP_PATH"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qr LocationWrapped.ipa Payload
          rm -rf Payload
          ls -lh LocationWrapped.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: LocationWrapped-ipa
          path: LocationWrapped.ipa
          if-no-files-found: error
